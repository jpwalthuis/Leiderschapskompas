name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typen
        run: npm run typecheck
      - name: Unit tests (itemregister, testmotor, opslag)
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser voor end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end (volledige afname op telefoon en opengevouwen vouwtelefoon)
        run: npm run e2e
      - name: Rapport bij falen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: playwright-report/
          retention-days: 7
