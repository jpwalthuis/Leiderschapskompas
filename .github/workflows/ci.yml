name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typen
        run: npm run typecheck
      - name: Tests (inclusief itemregister, harde regels 1, 2, 8, 9)
        run: npm test
      - name: Build
        run: npm run build
