<style>
/* Layout: één smalle kolom (telefoon eerst), testscherm met vaste opbouw, rapport als tabbladen. Huisstijl Ekana: oranje, lichtgrijs, grijze knoppen, Cardo. */
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --ink:#3A3A3A; --muted:#6D6D6D; --line:#DCD7D2;
  --navy:#9F5823; --teal:#9F5823; --teal-soft:#FAEFE6; --blue:#2F72A8; --blue-soft:#EEF4FA;
  --amber:#9A5B00; --amber-soft:#F7EBD8; --grey-soft:#E8E4E0; --s1:#C96B2A; --s2:#2F72A8;
  --merk:#D8894E; --knop:#737373; --knop-tekst:#FFFFFF;
  --font-display:"Cardo",Georgia,"Times New Roman",serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1917; --surface:#24211F; --ink:#EEEAE6; --muted:#B5ADA6; --line:#3A3531;
  --navy:#EDA877; --teal:#E0915A; --teal-soft:#3A2A1F; --blue:#5592CC; --blue-soft:#1A2430;
  --amber:#E3A852; --amber-soft:#3A2A12; --grey-soft:#2E2A27; --s1:#D07D45; --s2:#5592CC;
  --merk:#D8894E; --knop:#5E5A57; --knop-tekst:#EEEAE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1917; --surface:#24211F; --ink:#EEEAE6; --muted:#B5ADA6; --line:#3A3531;
  --navy:#EDA877; --teal:#E0915A; --teal-soft:#3A2A1F; --blue:#5592CC; --blue-soft:#1A2430;
  --amber:#E3A852; --amber-soft:#3A2A12; --grey-soft:#2E2A27; --s1:#D07D45; --s2:#5592CC;
  --merk:#D8894E; --knop:#5E5A57; --knop-tekst:#EEEAE6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px}
button:focus-visible,.opt:focus-visible,.pick:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn-primary{background:var(--knop);border-color:var(--knop);color:var(--knop-tekst);font-family:var(--font-display);font-size:1.05rem;border-radius:999px;padding-inline:20px}

.progress{height:4px;background:var(--grey-soft);border-radius:4px;overflow:hidden}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pick:hover{border-color:var(--teal)}

.why dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;margin:0}
.why dt{color:var(--muted)} .why dd{margin:0;min-width:0}
.chip{display:inline-block;font-family:var(--font-mono);font-size:.7rem;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:600}
.ev-sterk{background:var(--teal-soft);color:var(--teal)}
.ev-matig{background:var(--blue-soft);color:var(--blue)}

.ev-duiding{background:var(--grey-soft);color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}

.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--teal)}
.bar{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr 2.6rem;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:10px;background:var(--grey-soft);border-radius:6px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:6px}
.bar .fill.alt{background:var(--blue)}
.bar .fill.exp{background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 4px,var(--amber-soft) 4px,var(--amber-soft) 8px)}
.bar .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.callout{background:var(--teal-soft);border-radius:8px;padding:12px 14px;color:var(--ink)}
.callout.warn{background:var(--amber-soft)}
.arche{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.arche{grid-template-columns:1fr}}
.arche .col{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:8px;border:1px solid var(--line);min-width:0}
.arche .col.on{border:2px solid var(--teal);background:var(--teal-soft)}
.arche .col h4{margin:0;font-size:.8rem;font-family:var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.arche .col span{font-size:.88rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.8rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--grey-soft);position:sticky;top:0}
td.code{font-family:var(--font-mono);white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-family:var(--font-mono);font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--navy)}
.kv span{font-size:.78rem;color:var(--muted)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.refs li{font-size:.82rem}
.sample-badge{font-family:var(--font-mono);font-size:.72rem;background:var(--amber-soft);color:var(--amber);padding:4px 8px;border-radius:6px;align-self:flex-start}
.wrap.wide{max-width:1040px}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0;flex:1 1 160px}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:9px}
.matrix table{min-width:0}
.matrix td.cell{text-align:center;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}
.dprow,.dpaxis{display:grid;grid-template-columns:minmax(0,11rem) 1fr 5rem;gap:10px;align-items:center}
.dprow{font-size:.85rem}
.dpaxis{font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}
@media (max-width:520px){.dprow,.dpaxis{grid-template-columns:minmax(0,7.5rem) 1fr 4rem}.dprow{font-size:.78rem}}
.dptrack{position:relative;height:20px;border-bottom:1px solid var(--line)}
.ticks{position:relative;height:14px}
.ticks span{position:absolute;transform:translateX(-50%)}
.dptrack .ref{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1.5px dashed var(--muted)}
.dptrack .ci{position:absolute;top:9px;height:2px;background:var(--s1)}
.dptrack .dot{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 2px var(--surface)}
.dprow .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:.78rem}
.supp{font-size:.78rem;color:var(--muted);font-style:italic}
.entities{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.entity{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.entity b{font-family:var(--font-mono);font-size:.8rem;color:var(--navy)}
.entity span{font-size:.82rem;color:var(--muted)}
.entity.vault{border-style:dashed}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.78rem;padding:6px 9px;border-radius:6px;max-width:240px}
.clientlist td{white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===================== BRONNEN ===================== */
const SRC = {
  bakan:{t:"Bakan, D. (1966). The Duality of Human Existence.",n:"Introduceert agency en communion als twee basismodaliteiten."},
  abele:{t:"Abele, A. E. & Wojciszke, B. (2007; 2014). Dual Perspective Model; overzicht 'Big Two'.",n:"Agency en communion als fundamentele inhoudsdimensies, breed gerepliceerd."},
  helgeson:{t:"Helgeson, V. S. (1994). Unmitigated agency and unmitigated communion: an analysis of the negative components of masculinity and femininity.",n:"Verbindt agency/communion aan de traditionele masculien/feminien-indeling."},
  bfi2:{t:"Soto, C. J. & John, O. P. (2017). The Next Big Five Inventory (BFI-2). JPSP.",n:"Extraversie als gevalideerde Big Five-dimensie."},
  mcgowan:{t:"McGowan, D. What Is Wrong with Jung?",n:"Kritisch over Jungs archetypen, maar introversie/extraversie geldt als empirisch toetsbaar deel van Jungs werk."},
  sdt:{t:"Deci, E. L. & Ryan, R. M. (2000); Ryan & Deci (2017). Self-Determination Theory.",n:"Autonomie, competentie en verbondenheid als psychologische basisbehoeften."},
  bpnsfs:{t:"Chen, B. et al. (2015). BPNSFS; Olafsen, Halvari & Frølund (2021) werkversie; Noorse validatie (2022).",n:"Behoeftebevrediging en -frustratie hangen sterk en tegengesteld samen met vitaliteit."},
  schwartz:{t:"Schwartz, S. H. (2012). An Overview of the Schwartz Theory of Basic Values.",n:"Validiteit van de waardentheorie onderbouwd met data uit 82 landen."},
  pvq:{t:"Schwartz, S. H. et al. (2001). Portrait Values Questionnaire. J. Cross-Cult. Psych. 32, 519-542.",n:"Waarden gemeten via concrete, minder abstracte beschrijvingen."},
  dutch:{t:"De Dreu, Evers, Beersma, Kluwer & Nauta (2001). J. Organizational Behavior 22(6), 645-668.",n:"Vijf conflictstrategieën; goede tot uitstekende psychometrie; zelf-, tegenpartij- en observatorrapport convergeren voor probleemoplossen, forceren en toegeven, niet voor vermijden."},
  tk:{t:"Thomas, K. W. & Kilmann, R. H. (1974); Kilmann & Thomas (1977).",n:"Vijf conflictmodi op basis van zorg voor eigen en andermans belang. Model vrij te gebruiken; TKI-items en -naam zijn beschermd."},
  vignet:{t:"Int. J. Conflict Management (2018). Validity of self-reported conflict handling preferences.",n:"DUTCH voorspelde 4 van 5 stijlen in vignetkeuzes; alleen forceren voorspelde gedrag in een rollenspel."},
  tirt:{t:"Brown, A. & Maydeu-Olivares, A. (2011) EPM 71(3); (2013) Psychological Methods 18(1).",n:"Thurstonian IRT lost de problemen van ipsatieve scores bij gedwongen keuze op."},
  projectief:{t:"Lilienfeld, S. O., Wood, J. M. & Garb, H. N. (2000). The scientific status of projective techniques.",n:"Beperkte validiteit en incrementele waarde van projectieve technieken."},
  iat:{t:"Carpenter, T. P., Goedderz, A. & Lai, C. K. (2023). PSPB 49(9).",n:"Eén impliciete-associatie-afname is te ruisgevoelig voor een traitschatting; aggregeren over afnames helpt."},
  pearson:{t:"Pearson, C. S. & Marr, H. K. Pearson-Marr Archetype Indicator (PMAI), CAPT.",n:"Twaalf archetypen. Het instrument is beschermd; alleen het concept wordt hier als duiding gebruikt."},
  blueprint:{t:"Assessment Architectuur (eigen document), p. 2: mapping archetypen op agentisch / communaal / geïntegreerd.",n:"Eigen hypothese, niet empirisch getoetst."}
};

/* ===================== KADERS ===================== */
const K = {
  big2:"Big Two: agency (daadkracht) en communion (verbinding)",
  extra:"Big Five: extraversie (Jungs introversie/extraversie)",
  sdt:"Zelfdeterminatietheorie: basisbehoeften",
  waarden:"Schwartz-waardentheorie: vier hogere-orde-waarden",
  conflict:"Dual concern-model: vijf conflictstrategieën"
};

/* ===================== ITEMS ===================== */
// ev: {c: construct, m: methode, i: item}
const EV_REFLEX = {c:"sterk",m:"experimenteel",i:"nieuw"};
const P1 = [
  {id:"R1",word:"Weerstand",A:"wall",C:"knot"},
  {id:"R2",word:"Succes",A:"flag",C:"gears"},
  {id:"R3",word:"Leiderschap",A:"arrow",C:"ring"},
  {id:"R4",word:"Groei",A:"stairs",C:"roots"},
  {id:"R5",word:"Falen",A:"miss",C:"broken"},
  {id:"R6",word:"Energie",A:"spike",C:"overlap"}
].map(x=>({...x,construct:"Agentische versus communale associatie",kader:K.big2,src:["bakan","abele","projectief","iat"],ev:EV_REFLEX,
  note:"Het construct is sterk onderbouwd. De meetmethode (snelle beeldkeuze) is dat niet: projectieve en impliciete methoden hebben beperkte betrouwbaarheid. Daarom wordt dit alleen gerapporteerd als reflexindicatie naast het zelfbeeld op hetzelfde construct, nooit als losse uitslag."}));

const LK = [
  {id:"Z1",d:"agency",t:"Ik neem graag de leiding als er een doel bereikt moet worden.",construct:"Agency"},
  {id:"Z2",d:"agency",t:"Ik zet door, ook als anderen twijfelen.",construct:"Agency"},
  {id:"Z3",d:"agency",t:"Ik beoordeel mijn werk vooral op het resultaat.",construct:"Agency"},
  {id:"Z4",d:"communion",t:"Ik merk snel hoe het met anderen in het team gaat.",construct:"Communion"},
  {id:"Z5",d:"communion",t:"Ik investeer tijd in relaties, ook als dat niets direct oplevert.",construct:"Communion"},
  {id:"Z6",d:"communion",t:"Ik vind het belangrijk dat iedereen zich gehoord voelt.",construct:"Communion"},
  {id:"E1",d:"extra",t:"Ik krijg energie van gesprekken met veel mensen.",construct:"Extraversie (sociabiliteit)"},
  {id:"E2",d:"extra",r:1,t:"Na een dag vol overleg heb ik tijd alleen nodig om op te laden.",construct:"Extraversie (energieniveau, omgekeerd)"},
  {id:"E3",d:"extra",t:"In een groep neem ik makkelijk het woord.",construct:"Extraversie (assertiviteit)"},
  {id:"E4",d:"extra",r:1,t:"Ik werk het liefst in stilte aan mijn eigen taken.",construct:"Extraversie (omgekeerd)"},
  {id:"B1",d:"satA",t:"In mijn werk kan ik zelf kiezen hoe ik dingen aanpak.",construct:"Autonomie: bevrediging (energiebron)"},
  {id:"B2",d:"satC",t:"Ik voel me bekwaam in wat ik doe.",construct:"Competentie: bevrediging (energiebron)"},
  {id:"B3",d:"satR",t:"Ik voel me verbonden met de mensen met wie ik werk.",construct:"Verbondenheid: bevrediging (energiebron)"},
  {id:"B4",d:"frA",t:"Ik voel me in mijn werk vaak gedwongen tot dingen die ik niet zelf kies.",construct:"Autonomie: frustratie (energielek)"},
  {id:"B5",d:"frC",t:"Ik twijfel vaak of ik mijn werk goed genoeg doe.",construct:"Competentie: frustratie (energielek)"},
  {id:"B6",d:"frR",t:"Ik voel me in mijn werkomgeving op afstand gehouden.",construct:"Verbondenheid: frustratie (energielek)"},
  {id:"C1",d:"forc",t:"Bij een meningsverschil houd ik vast aan mijn standpunt tot de ander overstag gaat.",construct:"Forceren"},
  {id:"C2",d:"prob",t:"Bij een meningsverschil onderzoek ik met de ander wat ieder echt nodig heeft, tot we iets vinden waar we allebei achter staan.",construct:"Probleemoplossen"},
  {id:"C3",d:"comp",t:"Bij een meningsverschil stel ik voor dat we allebei iets inleveren.",construct:"Compromis"},
  {id:"C4",d:"yield",t:"Bij een meningsverschil pas ik me aan wat de ander wil, ook als ik het er niet mee eens ben.",construct:"Toegeven"},
  {id:"C5",d:"avoid",t:"Bij een meningsverschil laat ik het onderwerp liever rusten dan dat ik het gesprek aanga.",construct:"Vermijden"}
].map(x=>{
  const g = x.id[0];
  if(g==="Z") return {...x,kader:K.big2,src:["bakan","abele","helgeson"],ev:{c:"sterk",m:"sterk",i:"nieuw"},note:"Zelfrapportage op een sterk onderbouwd construct. Itemformulering is eigen werk en moet in de pilot psychometrisch worden getoetst."};
  if(g==="E") return {...x,kader:K.extra,src:["bfi2","mcgowan"],ev:{c:"sterk",m:"sterk",i:"nieuw"},note:"Gemeten als Big Five-extraversie. Jungs uitleg als 'richting van levensenergie' is theorie; de meetbare kern is extraversie."};
  if(g==="B") return {...x,kader:K.sdt,src:["sdt","bpnsfs"],ev:{c:"sterk",m:"sterk",i:"nieuw"},note:"Energie geven en energie verliezen worden gemeten als behoeftebevrediging en behoeftefrustratie, die aantoonbaar met vitaliteit samenhangen. Prototype: één item per subschaal; productie: minimaal vier."};
  return {...x,kader:K.conflict,src:["dutch","tk"],ev:{c:"sterk",m:"sterk",i:"nieuw"},note:"Strategie uit het dual concern-model, gemeten in rust. Eigen formulering; geen TKI- of DUTCH-items overgenomen."};
});

const VAL = {
  ST:{n:"Bijdragen aan anderen",s:"dat mijn werk anderen en de samenleving echt verder helpt",full:"Zelfoverstijging"},
  SE:{n:"Invloed en resultaat",s:"dat ik invloed heb en zichtbaar resultaat neerzet",full:"Zelfverheffing"},
  OC:{n:"Vrijheid en vernieuwing",s:"dat ik vrij ben om nieuwe wegen te verkennen",full:"Openheid voor verandering"},
  CO:{n:"Zekerheid en structuur",s:"dat er zekerheid, structuur en betrouwbaarheid is",full:"Behoud"}
};
const DIL = [["SE","ST"],["OC","CO"],["OC","ST"],["CO","SE"],["ST","CO"],["SE","OC"]].map((p,i)=>({
  id:"W"+(i+1),type:"waarde",a:p[0],b:p[1],q:"Wat weegt voor jou zwaarder in je werk?",
  construct:VAL[p[0]].full+" versus "+VAL[p[1]].full,kader:K.waarden,src:["schwartz","pvq","tirt"],ev:{c:"sterk",m:"matig",i:"nieuw"},
  note:"Gedwongen keuze tussen hogere-orde-waarden. Productie: scoren met Thurstonian IRT. Dit prototype telt keuzes (ipsatief), waardoor alleen de rangorde binnen de persoon betekenis heeft."}));
DIL.push(

function progress(){ const f=FLOW(); let done=0; for(let k=0;k<step;k++){ if(["p1","lk","dil","p3"].includes(f[k].s)) done++; } return Math.round(done/totalQ*100); }

/* ===================== SCORING ===================== */
const pct = m => m==null?null:Math.round((m-1)/4*100);
function score(){
  const A=S.ans, mean=ids=>{const v=ids.map(id=>{const it=LK.find(x=>x.id===id);let a=A[id];if(a==null)return null;return it.r?6-a:a;}).filter(x=>x!=null);return v.length?v.reduce((p,c)=>p+c,0)/v.length:null;};
  const byD=d=>LK.filter(x=>x.d===d).map(x=>x.id);
  const agency=pct(mean(byD("agency"))), communion=pct(mean(byD("communion"))), extra=pct(mean(byD("extra")));
  const sdt={}; ["A","C","R"].forEach(n=>{sdt[n]={sat:pct(mean(byD("sat"+n))),fr:pct(mean(byD("fr"+n)))};});
  const conf={}; Object.keys(STY).forEach(k=>conf[k]=pct(mean(byD(k))));
  // reflex
  const rx=P1.map(it=>A[it.id]).filter(v=>v==="A"||v==="C");
  const reflexAg = rx.length?Math.round(rx.filter(v=>v==="A").length/rx.length*100):null;
  const rts=P1.filter(it=>S.rt[it.id]!=null&&A[it.id]!=="timeout").map(it=>S.rt[it.id]);
  const med=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);};
  const timeouts=[...P1,...DIL,...P3].filter(it=>A[it.id]==="timeout").length;
  const tooFast=P1.filter(it=>S.rt[it.id]!=null&&S.rt[it.id]<300&&A[it.id]!=="timeout").length;
  // waarden
  const vw={ST:0,SE:0,OC:0,CO:0};
  DIL.filter(d=>d.type==="waarde").forEach(d=>{const v=A[d.id]; if(v==="a")vw[d.a]++; else if(v==="b")vw[d.b]++;});
  const vRank=Object.keys(vw).sort((x,y)=>vw[y]-vw[x]);
  const erger=DIL.filter(d=>d.type==="erger").map(d=>A[d.id]==="a"?"A":A[d.id]==="b"?"C":null);
  // conflict onder druk
  const druk=P3.map(it=>({id:it.id,k:A[it.id]}));
  const lk=LK.map(it=>A[it.id]).filter(v=>v!=null);
  const straight=lk.length>8 && new Set(lk).size===1;
  const diff=agency-communion;
  const group=Math.abs(diff)<=12?"geintegreerd":diff>0?"agentisch":"communaal";
  return {agency,communion,extra,sdt,conf,reflexAg,rtMed:med(rts),timeouts,tooFast,vw,vRank,erger,druk,straight,group,rx:rx.length};
}
const band = v => v==null?"onbekend":v<35?"laag":v<=65?"gemiddeld":"hoog";

function summary(r){
  const lead = r.group==="agentisch"?"Je leidt vooral vanuit daadkracht: doelen stellen, doorzetten, resultaat neerzetten."
    : r.group==="communaal"?"Je leidt vooral vanuit verbinding: zien wat mensen nodig hebben en zorgen dat het team samen blijft."
    : "Daadkracht en verbinding zijn bij jou ongeveer in balans; je kunt van het ene naar het andere schakelen.";
  const en = r.extra>65?"Je haalt energie vooral uit contact en interactie.":r.extra<35?"Je laadt vooral op in rust en alleen-tijd.":"Je haalt energie zowel uit contact als uit rust.";
  const top = VAL[r.vRank[0]].n.toLowerCase();
  return `${lead} ${en} In je keuzes weegt <b>${esc(top)}</b> het zwaarst.`;
}
function clientView(r){
  const gap = r.reflexAg==null?null:r.reflexAg-r.agency;
  const gapTxt = gap==null?"Je hebt in fase 1 geen beelden binnen de tijd gekozen, dus er is geen reflexindicatie."
    : Math.abs(gap)<=20?"Je snelle beeldkeuzes liggen in lijn met hoe je jezelf beschrijft."
    : gap>0?"In je snelle beeldkeuzes koos je vaker voor daadkracht dan je zelfbeeld laat zien. Dat kan een gespreksonderwerp zijn met je coach."
    : "In je snelle beeldkeuzes koos je vaker voor verbinding dan je zelfbeeld laat zien. Dat kan een gespreksonderwerp zijn met je coach.";
  const needs={A:"Autonomie",C:"Competentie",R:"Verbondenheid"};
  const src=Object.keys(needs).filter(n=>r.sdt[n].sat>65).map(n=>needs[n].toLowerCase());
  const leak=Object.keys(needs).filter(n=>r.sdt[n].fr>50).map(n=>needs[n].toLowerCase());
  const rustTop=Object.keys(r.conf).sort((a,b)=>r.conf[b]-r.conf[a])[0];
  const late=r.druk.slice(2).map(d=>d.k).filter(k=>STY[k]);
  const drukTop=late.length?late[late.length-1]:null;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RND=mulberry(20261023);
const nrm=(m,s)=>{let u=0;while(!u)u=RND();const v=RND();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const clip=x=>Math.max(0,Math.min(100,Math.round(x)));
const pickW=(arr,w)=>{let r=RND()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}return arr[arr.length-1];};
const SECT={Q:"Gezondheidszorg",F:"Bouw",K:"Financiële dienstverlening",O:"Openbaar bestuur",J:"Informatie en communicatie",C:"Industrie"};
const ISCO={"1":"Leidinggevenden","2":"Specialisten","3":"Technici en vakspecialisten","4":"Administratief personeel"};
const NIV=["Geen leidinggevende","Teamleider","Middenmanagement","Directie"];
const AGE=["<30","30–39","40–49","50–59","60+"];
const REG={"NL-NH":"Noord-Holland","NL-ZH":"Zuid-Holland","NL-UT":"Utrecht","NL-NB":"Noord-Brabant","SA-01":"Riyad","SA-04":"Oostelijke Provincie"};
const GEN=["Man","Vrouw","Anders","Zeg ik liever niet"];
const MYCOACH=7, MINN=10;
const OPDR={zorg:{n:"Zorggroep Noord",sec:"Q"},bouw:{n:"Bouwbedrijf West",sec:"F"},indiv:{n:"Individuele cliënten",sec:null}};
function makePerson(i,coach,opdr){
  const sec = opdr&&OPDR[opdr].sec ? OPDR[opdr].sec : pickW(Object.keys(SECT),[3,2,2,2,2,2]);
  const niv = pickW([0,1,2,3],[3,4,3,1]);
  const isco = niv>=2 ? pickW(["1","2"],[3,1]) : pickW(["1","2","3","4"],[1,4,3,2]);
  const reg = pickW(Object.keys(REG),[3,3,2,2,2,1]);
  const gen = pickW(GEN,[47,47,2,4]);
  const age = pickW(AGE,[2,4,4,3,1]);
  const ag=clip(nrm(46+niv*6,14)), co=clip(nrm(54+(sec==="Q"?8:0)-(sec==="F"?5:0),14)), ex=clip(nrm(52,17));
  const sdt={A:{sat:clip(nrm(60+niv*3,15)),fr:clip(nrm(sec==="O"?40:32,15))},C:{sat:clip(nrm(66,13)),fr:clip(nrm(30,14))},R:{sat:clip(nrm(62,15)),fr:clip(nrm(28,15))}};
  const val = ag>co+8 ? pickW(["SE","OC","CO","ST"],[4,3,2,1]) : co>ag+8 ? pickW(["ST","CO","OC","SE"],[4,2,2,1]) : pickW(["SE","OC","CO","ST"],[2,3,2,3]);
  const rust = ag>co+10 ? pickW(["forc","prob","comp"],[3,4,1]) : co>ag+10 ? pickW(["prob","yield","comp","avoid"],[4,3,2,1]) : pickW(["prob","comp","avoid","forc","yield"],[4,3,1,1,1]);
  const druk = RND()<.06 ? "timeout" : ag>co+10 ? pickW(["forc","avoid","yield"],[6,2,1]) : co>ag+10 ? pickW(["yield","avoid","forc"],[5,3,2]) : ex<40 ? pickW(["avoid","forc","yield"],[5,2,2]) : pickW(["forc","yield","avoid"],[4,3,3]);
  const d=new Date(2026,Math.floor(RND()*9),1+Math.floor(RND()*27));
  return {id:"D-"+String(coach).padStart(2,"0")+String(i).padStart(3,"0"),coach,opdr,sec,niv,isco,reg,gen,age,ag,co,ex,sdt,val,rust,druk,
    date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
}

    ${sel("fGen","Gender",[["all","Alle"],...GEN.map(g=>[g,g])],S.f.gen)}</div>`;
  const group = f.length<MINN
    ? `<div class="callout warn"><b>Groepsprofiel verborgen.</b> Deze selectie heeft ${f.length} cliënt${f.length===1?"":"en"}. Onder de ${MINN} is een groepsrapport voor een opdrachtgever te herleiden tot personen. De lijst met je eigen cliënten hieronder blijft zichtbaar.</div>`
    : `<div class="dgrid">
      <div class="panel chart"><h3>Daadkracht en verbinding</h3><p class="muted">Elke stip is één cliënt. Stippellijnen op 50.</p>${scatter(f)}</div>
      <div class="panel"><h3>Energie: basisbehoeften</h3>
        <div class="legend"><span><i class="sw" style="background:var(--s1)"></i>vervuld (energiebron)</span><span><i class="sw" style="background:var(--s2)"></i>gefrustreerd (energielek)</span></div>
        ${[["A","Autonomie"],["C","Competentie"],["R","Verbondenheid"]].map(([k,l])=>{const s=avg(f.map(p=>p.sdt[k].sat)),fr=avg(f.map(p=>p.sdt[k].fr));return hbar(l+" vervuld",s,"var(--s1)",`${l}, vervuld: gemiddeld ${s}`)+hbar(l+" gefrustreerd",fr,"var(--s2)",`${l}, gefrustreerd: gemiddeld ${fr}`);}).join("")}
        <p class="muted">Gemiddelden, schaal 0–100.</p></div>
      <div class="panel matrix"><h3>Conflict: in rust en onder de hoogste druk</h3><p class="muted">Rij: voorkeursstrategie in rust. Kolom: keuze in situatie D4.</p>${matrix(f)}</div>
      <div class="panel"><h3>Zwaarst wegende drijfveer</h3>
        ${Object.keys(VAL).map(k=>{const c=f.filter(p=>p.val===k).length;const v=Math.round(c/f.length*100);return hbar(VAL[k].n,v,"var(--s1)",`${VAL[k].n}: ${c} van ${f.length} cliënten (${v}%)`);}).join("")}
        <p class="muted">Percentage cliënten bij wie deze waarde bovenaan staat.</p></div></div>`;
  const rows=f.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="panel">${filters}<p class="muted"><b>${f.length}</b> van ${mine.length} cliënten in deze selectie.</p></div>
  <span class="eyebrow">Groepsprofiel · deelbaar met opdrachtgever vanaf ${MINN} personen</span>${group}
  <div class="panel"><h3>Mijn cliënten</h3><p class="muted">In de echte app staat hier de naam; die komt uit een aparte, versleutelde opslag en is alleen zichtbaar voor de cliënt en de eigen coach.</p>
  <div class="tablewrap"><table class="clientlist"><thead><tr><th>Code</th><th>Afname</th><th>Opdracht</th><th>Niveau</th><th>Agency</th><th>Communion</th><th>Drijfveer</th><th>Conflict rust → druk</th></tr></thead><tbody>
  ${rows.map(p=>`<tr><td class="code">${p.id}</td><td class="code">${p.date}</td><td>${esc(OPDR[p.opdr].n)}</td><td>${NIV[p.niv]}</td><td class="code">${p.ag}</td><td class="code">${p.co}</td><td>${VAL[p.val].n}</td><td>${STY[p.rust]} → ${DRUK[p.druk]}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}
function scatter(arr){
  const W=340,H=280,L=34,B=38,T=10,RR=10,pw=W-L-RR,ph=H-T-B;
  const X=v=>L+v/100*pw, Y=v=>T+(100-v)/100*ph;
  let g="";
  [0,25,50,75,100].forEach(t=>{
    const dash=t===50?'stroke-dasharray="4 3"':"", col=t===50?"var(--muted)":"var(--line)";
    g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${T+ph}" style="stroke:${col}" ${dash}/><line x1="${L}" x2="${L+pw}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:${col}" ${dash}/>`;
    g+=`<text x="${X(t)}" y="${T+ph+12}" text-anchor="middle">${t}</text><text x="${L-5}" y="${Y(t)+3}" text-anchor="end">${t}</text>`;
  });
  g+=`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle">Agency (daadkracht)</text><text transform="translate(9 ${T+ph/2}) rotate(-90)" text-anchor="middle">Communion (verbinding)</text>`;
  g+=`<text x="${X(98)}" y="${Y(96)}" text-anchor="end">beide hoog</text><text x="${X(2)}" y="${Y(96)}">vooral verbinding</text><text x="${X(98)}" y="${Y(3)}" text-anchor="end">vooral daadkracht</text><text x="${X(2)}" y="${Y(3)}">beide lager</text>`;
  arr.forEach(p=>{ g+=`<circle cx="${X(p.ag).toFixed(1)}" cy="${Y(p.co).toFixed(1)}" r="5" style="fill:var(--s1);stroke:var(--surface);stroke-width:2" data-tip="${p.id} · agency ${p.ag} · communion ${p.co}"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spreidingsdiagram agency tegen communion, ${arr.length} cliënten">${g}</svg>`;
}
function matrix(arr){
  const rows=Object.keys(STY), cols=Object.keys(DRUK);
  const cnt={}; let max=1;
  rows.forEach(r=>cols.forEach(c=>{const n=arr.filter(p=>p.rust===r&&p.druk===c).length;cnt[r+c]=n;if(n>max)max=n;}));
  return `<div class="tablewrap"><table><thead><tr><th>Rust ↓ / druk →</th>${cols.map(c=>`<th>${DRUK[c]}</th>`).join("")}</tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${STY[r]}</td>${cols.map(c=>{const n=cnt[r+c];const p=Math.round(n/max*85);return `<td class="cell" style="background:color-mix(in oklab, var(--s1) ${p}%, var(--surface));color:${p>55?"var(--surface)":"var(--ink)"}" data-tip="In rust ${STY[r].toLowerCase()}, onder druk ${DRUK[c].toLowerCase()}: ${n}">${n||""}</td>`;}).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}
function dashBench(){
  const g=GROUP[S.bg], m=MEAS[S.bm];
  const groups=g.order.map(l=>({l,...stats(DATA.filter(p=>g.k(p)===l).map(m.g))}));
  const tot=stats(DATA.map(m.g));
  const filters=`<div class="filters">${sel("bGroup","Vergelijk naar",Object.keys(GROUP).map(k=>[k,GROUP[k].n]),S.bg)}${sel("bMeas","Uitkomst",Object.keys(MEAS).map(k=>[k,MEAS[k].n]),S.bm)}</div>`;
  const invChip = g.inv==="scalair"?`<span class="chip ev-sterk">invariantie: scalair</span>`:g.inv==="gedeeltelijk"?`<span class="chip ev-matig">invariantie: gedeeltelijk</span>`:`<span class="chip ev-experimenteel">invariantie: niet getoetst</span>`;
  const invTxt = g.inv==="scalair"?"Gemiddelden mogen worden vergeleken: de test meet in deze groepen aantoonbaar hetzelfde."
    : g.inv==="gedeeltelijk"?"Vergelijken met voorzichtigheid: niet alle vragen werken in elke groep gelijk. In productie tellen alleen de invariante vragen mee."
    : "Gemiddelden worden niet getoond. Zolang niet is aangetoond dat de test in deze groepen hetzelfde meet, kan een verschil ook uit de vragen zelf komen.";
  let body;
  if(g.inv==="niet getoetst"){
    body=`<div class="callout warn">${invTxt}</div><div class="tablewrap"><table style="min-width:320px"><thead><tr><th>Groep</th><th>Aantal deelnemers</th></tr></thead><tbody>${groups.map(x=>`<tr><td>${esc(x.l)}</td><td class="code">${x.n<MINN?"&lt; "+MINN:x.n}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    const vis=groups.filter(x=>x.n>=MINN);
    let lo=Math.floor((Math.min(tot.m,...vis.map(x=>x.m-x.ci))-3)/5)*5, hi=Math.ceil((Math.max(tot.m,...vis.map(x=>x.m+x.ci))+3)/5)*5;
    lo=Math.max(0,lo); hi=Math.min(100,hi);
    const pos=v=>((v-lo)/(hi-lo)*100).toFixed(2);
    const step=hi-lo>30?10:5; const ticks=[]; for(let t=lo;t<=hi;t+=step) ticks.push(t);
    body=`<div class="callout ${g.inv==="scalair"?"":"warn"}">${invTxt}</div>
    <div class="stack">
      <div class="dpaxis"><span></span><div class="ticks">${ticks.map(t=>`<span style="left:${pos(t)}%">${t}</span>`).join("")}</div><span style="text-align:right">gem. (n)</span></div>
      ${groups.map(x=>x.n<MINN
        ? `<div class="dprow"><span>${esc(x.l)}</span><span class="supp">onderdrukt: minder dan ${MINN} deelnemers</span><span></span></div>`
        : `<div class="dprow" data-tip="${esc(x.l)}: gemiddeld ${x.m.toFixed(1)}, 95%-interval ${(x.m-x.ci).toFixed(1)}–${(x.m+x.ci).toFixed(1)}, n = ${x.n}"><span>${esc(x.l)}</span>
          <div class="dptrack"><span class="ref" style="left:${pos(tot.m)}%"></span><span class="ci" style="left:${pos(x.m-x.ci)}%;width:${(2*x.ci/(hi-lo)*100).toFixed(2)}%"></span><span class="dot" style="left:${pos(x.m)}%"></span></div>
          <span class="num">${x.m.toFixed(1)} (${x.n})</span></div>`).join("")}
      <div class="legend"><span><i class="sw" style="background:var(--s1);border-radius:50%"></i>groepsgemiddelde met 95%-interval</span><span><i class="sw" style="border-left:2px dashed var(--muted);border-radius:0;width:2px"></i>totaal: ${tot.m.toFixed(1)} (n = ${tot.n})</span></div>
    </div>
    <details><summary>Toon als tabel</summary><div class="tablewrap"><table style="min-width:420px"><thead><tr><th>Groep</th><th>n</th><th>Gemiddelde</th><th>95%-interval</th></tr></thead><tbody>
    ${groups.map(x=>`<tr><td>${esc(x.l)}</td><td class="code">${x.n<MINN?"&lt; "+MINN:x.n}</td><td class="code">${x.n<MINN?"–":x.m.toFixed(1)}</td><td class="code">${x.n<MINN?"–":(x.m-x.ci).toFixed(1)+"–"+(x.m+x.ci).toFixed(1)}</td></tr>`).join("")}</tbody></table></div></details>`;
  }
  return `<div class="panel">${filters}<div class="row">${invChip}<span class="muted" style="font-size:.78rem">Invariantiestatus is fictief, ter illustratie van de regel.</span></div></div>
  <div class="panel"><h3>${esc(m.n)} naar ${esc(g.n.toLowerCase())}</h3>${body}
  <p class="muted">Alle licentienemers samen, alleen deelnemers die toestemming gaven voor de benchmark. Groepen onder de ${MINN} worden nooit getoond, ook niet in combinatie met andere filters.</p></div>`;
}
function dashModel(){
  const E=[
    ["Licentienemer","praktijk, licentietype, looptijd, land",0],
    ["Coach","licentienemer, certificering (datum, versie)",0],
    ["Opdracht","coach, opdrachtgever, sector (NACE/ISIC met versie), start",0],
    ["Deelnemer","pseudoniem-ID, eigen coach",0],
    ["Identiteit","naam, e-mail. Aparte versleutelde opslag; alleen deelnemer en eigen coach",1],
    ["Afname","deelnemer, opdracht, datum, itemset-versie, scoringsversie",0],
    ["Profielsnapshot","per afname: beroep (ISCO-08 + versie), sector, leiderschapsniveau, aantal medewerkers, geboortejaar (getoond als klasse), land en regio (ISO 3166-2), gender (optioneel), opleiding (ISCED)",0],
    ["Antwoord","afname, item, itemversie, waarde, reactietijd (ms), getoonde positie",0],
    ["Score","afname, construct, waarde, marge, scoringsversie",0],
    ["Item","het itemregister: tekst per taal, construct, kader, bronnen, bewijs (construct/methode/item), versie",0],
    ["Toestemming","afname, doel (coachrapport of benchmark), datum, intrekking",0],
    ["Invariantiestudie","groepsvariabele, construct, niveau (configuraal, metrisch, scalair), steekproef, datum",0],
    ["Benchmarkaggregaat","groep, construct, n, gemiddelde, interval. Alleen n ≥ 10 en alleen afnames met benchmarktoestemming",0]];
  return `<div class="panel"><h2>Datamodel</h2><p class="muted">Dertien tabellen. Gestippeld = aparte, versleutelde opslag.</p>
  <div class="entities">${E.map(([n,f,v])=>`<div class="entity ${v?"vault":""}"><b>${esc(n)}</b><span>${esc(f)}</span></div>`).join("")}</div></div>
  <div class="panel"><h2>Ontwerpregels</h2><ul class="clean">
  <li>Ruwe antwoorden en reactietijden worden altijd bewaard met item- en scoringsversie, zodat alle scores na de pilot opnieuw te berekenen zijn.</li>
  <li>Kenmerken zoals functie en sector horen bij de afname, niet bij de persoon. Een herhaalmeting toont de situatie van dat moment.</li>
  <li>Alle kenmerken komen uit vaste lijsten (ISCO, NACE/ISIC, ISCED, ISO 3166). Geen vrije tekst.</li>
  <li>Geen bijzondere persoonsgegevens: geen etniciteit, religie of gezondheid.</li>
  <li>Het dashboard leest groepscijfers uit de benchmarkaggregaten, nooit rechtstreeks uit individuele scores.</li></ul></div>
  <div class="panel"><h2>Rollen onder de AVG</h2><ul class="clean">
  <li><b>Coach</b>: verwerkingsverantwoordelijke voor de gegevens van zijn cliënten (test, rapport, debrief).</li>
  <li><b>Wij, voor het coachrapport</b>: verwerker namens de coach. De verwerkersovereenkomst zit in de licentie.</li>
  <li><b>Wij, voor de benchmark</b>: verwerkingsverantwoordelijke, omdat de data dan voor een eigen doel wordt gebruikt (artikel 28 lid 10 AVG). Dat vraagt een eigen grondslag: een aparte toestemming van de deelnemer, die de coach in de test laat vragen.</li>
  <li>Gepseudonimiseerde data blijft persoonsgegeven onder de AVG. De benchmark krijgt daarom nooit de identiteitstabel.</li>
  <li>Voor deelnemers in Saoedi-Arabië geldt daarnaast de PDPL, wat ook de opslaglocatie bepaalt.</li></ul></div>`;
}
function dashBind(){
  const $=id=>document.getElementById(id);
  document.querySelectorAll("[data-dtab]").forEach(b=>b.addEventListener("click",()=>{S.dtab=b.dataset.dtab;render();}));
  $("back")?.addEventListener("click",()=>{S.screen="intro";render();});
  $("fOpdr")?.addEventListener("change",e=>{S.f.opdr=e.target.value;render();});
  $("fNiv")?.addEventListener("change",e=>{S.f.niv=e.target.value;render();});
  $("fGen")?.addEventListener("change",e=>{S.f.gen=e.target.value;render();});
  $("bGroup")?.addEventListener("change",e=>{S.bg=e.target.value;render();});
  $("bMeas")?.addEventListener("change",e=>{S.bm=e.target.value;render();});
  const tip=$("tip");
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("pointerenter",()=>{tip.textContent=el.dataset.tip;tip.hidden=false;});
    el.addEventListener("pointermove",ev=>{const x=Math.min(ev.clientX+12,window.innerWidth-250);tip.style.left=x+"px";tip.style.top=(ev.clientY+14)+"px";});
    el.addEventListener("pointerleave",()=>{tip.hidden=true;});
  });
}
render();
</script>
